name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 目前站点是纯静态原型，直接上传 prototypes/。
      # 接入 Vite 之后，把这一步换成 setup-node + npm ci + npm run build，
      # 并把 path 改成 dist/。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes

      - id: deploy
        uses: actions/deploy-pages@v4
